name: ono
description: Ono — Your guardian for becoming your best self.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  smooth_page_indicator: ^1.1.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.66.2
  animated_text_kit: ^4.2.2
  lottie: ^3.0.0
  supabase_flutter: ^2.3.4
  provider: ^6.1.1
  go_router: ^13.0.1
  intl: ^0.19.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  confetti: ^0.7.0
  share_plus: ^7.2.1
  url_launcher: ^6.2.2
  flutter_timezone: ^4.0.0
  google_sign_in: ^6.2.1
  crypto: ^3.0.3
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  health: ^13.3.1
  home_widget: ^0.10.0
  quick_actions: ^1.1.1
  device_calendar: ^3.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/google_fonts/
