# Builds the web app and publishes it to GitHub Pages:
#   https://eminhuseyn313.github.io/ono_flutter/
#
# It is the synced build (lib/main_production.dart): sign in with the same
# email as on the iPhone and both use the same data (Supabase).
#
# Needs, once: a public repo (Pages is paid for private ones) and
# Settings → Pages → Build and deployment → Source: GitHub Actions.
# Then every push to main redeploys; "Run workflow" deploys by hand.
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter build web --release -t lib/main_production.dart --base-href /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
